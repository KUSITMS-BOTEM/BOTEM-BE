server:
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  allowed-redirect-uris: ${KAKAO_ALLOWED_REDIRECT_URIS}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}

guest-contribution-token:
  access-token-expiration: ${GUEST_CONTRIBUTION_ACCESS_TOKEN_EXPIRATION:10m}
  issuer: ${GUEST_CONTRIBUTION_TOKEN_ISSUER:botem}
  audience: ${GUEST_CONTRIBUTION_TOKEN_AUDIENCE:guest-contribution}

swagger:
  username: ${SWAGGER_USERNAME}
  password: ${SWAGGER_PASSWORD}

payout-account:
  encryption:
    current-key-id: ${PAYOUT_ACCOUNT_ENCRYPTION_CURRENT_KEY_ID:v1}
    legacy-key-id: ${PAYOUT_ACCOUNT_ENCRYPTION_LEGACY_KEY_ID:v1}
    keys:
      v1: ${PAYOUT_ACCOUNT_ENCRYPTION_KEYS_V1:${PAYOUT_ACCOUNT_ENCRYPTION_KEY}}

admin:
  api-key: ${ADMIN_API_KEY}

s3:
  bucket: ${S3_BUCKET}
  region: ${S3_REGION}

wish-profile:
  base-url: ${WISH_PROFILE_BASE_URL}

funding-share:
  base-url: ${FUNDING_SHARE_BASE_URL}

contribution-thank-card:
  base-url: ${CONTRIBUTION_THANK_CARD_BASE_URL}

auth-cookie:
  domain: ${AUTH_COOKIE_DOMAIN}

sentry:
  dsn: ${SENTRY_DSN}
  environment: ${SENTRY_ENVIRONMENT}
  # 모든 요청을 추적하면 무료 한도를 넘기므로 일부만 표본으로 남긴다. 에러는 비율과 관계없이 모두 수집된다
  traces-sample-rate: 0.2
