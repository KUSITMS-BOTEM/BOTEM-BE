spring:
  application:
    name: botem
  profiles:
    default: local
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s

wish-profile:
  base-url: ${WISH_PROFILE_BASE_URL:https://botem.site}

payout-account:
  encryption:
    key: ${PAYOUT_ACCOUNT_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

# 로컬·테스트용 기본값. 운영은 application-prod.yaml에서 환경변수로만 받음
s3:
  bucket: ${S3_BUCKET:botem-local}
  region: ${S3_REGION:ap-northeast-2}

admin:
  api-key: ${ADMIN_API_KEY:local-admin-api-key}

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
