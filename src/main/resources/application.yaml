spring:
  application:
    name: botem
  profiles:
    default: local
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s
  # 요청이 끝날 때까지 DB 커넥션을 붙잡지 않도록 끈다. 엔티티는 연관관계 없이 ID로 참조하고
  # 서비스 트랜잭션 안에서 DTO로 바꿔 반환하므로 컨트롤러·직렬화 단계의 지연 로딩이 없다
  jpa:
    open-in-view: false
  # 금액 같은 정수 필드에 소수를 보내면 잘라서 받지 않고 400으로 거절한다
  jackson:
    deserialization:
      accept-float-as-int: false

# 모든 로그에 요청 ID를 붙이고, Sentry 이벤트에도 같은 값을 태그로 남긴다 (RequestIdFilter)
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

sentry:
  context-tags: requestId
  # 모니터링 수집(30초마다)과 헬스 체크는 성능 추적에서 뺀다. 넣으면 무료 한도를 수집 요청이 대부분 차지한다
  ignored-transactions:
    - ".*/actuator/.*"

# 지표는 서버 안의 수집 에이전트(Grafana Alloy)만 가져간다. 외부 요청은 Nginx가 /actuator를 막는다
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: botem
    distribution:
      # 무료 플랜의 지표 개수 한도(1만 개)를 넘지 않도록 백분위 히스토그램 대신 고정 구간만 남긴다
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,3s

# 로컬·테스트용 기본값. 운영은 application-prod.yaml에서 환경변수로만 받음
wish-profile:
  base-url: ${WISH_PROFILE_BASE_URL:https://botem.me}

funding-share:
  base-url: ${FUNDING_SHARE_BASE_URL:https://botem.me/share}

contribution-thank-card:
  base-url: ${CONTRIBUTION_THANK_CARD_BASE_URL:https://botem.me/thank-cards}

guest-contribution-token:
  access-token-expiration: ${GUEST_CONTRIBUTION_ACCESS_TOKEN_EXPIRATION:10m}
  issuer: ${GUEST_CONTRIBUTION_TOKEN_ISSUER:botem}
  audience: ${GUEST_CONTRIBUTION_TOKEN_AUDIENCE:guest-contribution}

payout-account:
  encryption:
    current-key-id: ${PAYOUT_ACCOUNT_ENCRYPTION_CURRENT_KEY_ID:v1}
    legacy-key-id: ${PAYOUT_ACCOUNT_ENCRYPTION_LEGACY_KEY_ID:v1}
    keys:
      v1: ${PAYOUT_ACCOUNT_ENCRYPTION_KEYS_V1:${PAYOUT_ACCOUNT_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}}

# 로컬·테스트용 기본값. 운영은 application-prod.yaml에서 환경변수로만 받음
s3:
  bucket: ${S3_BUCKET:botem-local}
  region: ${S3_REGION:ap-northeast-2}

admin:
  api-key: ${ADMIN_API_KEY:local-admin-api-key}

post-processing:
  async:
    # 외부 정리 작업이 요청 처리 스레드를 점유하지 않도록 별도 실행기를 쓴다. 포화 시 작업을 버리고 로그로 남긴다.
    core-pool-size: ${POST_PROCESSING_ASYNC_CORE_POOL_SIZE:2}
    max-pool-size: ${POST_PROCESSING_ASYNC_MAX_POOL_SIZE:4}
    queue-capacity: ${POST_PROCESSING_ASYNC_QUEUE_CAPACITY:100}
    await-termination: ${POST_PROCESSING_ASYNC_AWAIT_TERMINATION:10s}

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
