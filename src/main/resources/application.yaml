spring:
  application:
    name: botem
  profiles:
    default: local
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s

wish-profile:
  base-url: ${WISH_PROFILE_BASE_URL:https://botem.site}

payout-account:
  encryption:
    key: ${PAYOUT_ACCOUNT_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
