spring:
  datasource:
    url: jdbc:h2:mem:botem;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  # 일반 테스트는 Redis 없이 돈다(로컬에 Redis가 떠 있어도 쓰지 않도록 열리지 않은 포트를 가리킨다).
  # 요청 제한은 연결 실패로 통과하고 회원 상태는 DB로 조회한다. 실제 Redis 검증은 redisTest 작업(@Tag("redis"))에서 한다
  data:
    redis:
      port: 1
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

kakao:
  client-id: test-client-id
  client-secret: test-client-secret
  redirect-uri: http://localhost:8080/api/auth/kakao/callback
  allowed-redirect-uris:
    - http://localhost:8080/api/auth/kakao/callback

jwt:
  secret: dGVzdC1qd3Qtc2VjcmV0LWtleS10aGF0LWlzLWxvbmctZW5vdWdoLWZvci1oczI1Ng==
  access-token-expiration: 1h
  refresh-token-expiration: 7d

swagger:
  username: ""
  password: ""

# 여러 테스트가 같은 IP(127.0.0.1)로 요청을 보내므로 요청 제한에 걸리지 않게 넉넉히 둔다
rate-limit:
  contribution-per-minute: 10000
  attachment-upload-url-per-minute: 10000
  guest-access-per-minute: 10000

user-status-cache:
  enabled: false
