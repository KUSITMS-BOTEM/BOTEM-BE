  secret: dGVzdC1qd3Qtc2VjcmV0LWtleS10aGF0LWlzLWxvbmctZW5vdWdoLWZvci1oczI1Ng==
  access-token-expiration: 1h
  refresh-token-expiration: 7d

swagger:
  username: ""
  password: ""
