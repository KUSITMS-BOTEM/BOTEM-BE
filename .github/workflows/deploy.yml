name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: jar 빌드
        run: ./gradlew bootJar

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드 및 ECR push
        id: image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: SSH 키 설정
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      - name: 러너 IP에 SSH 허용
        id: runner
        env:
          SECURITY_GROUP_ID: ${{ secrets.EC2_SECURITY_GROUP_ID }}
        run: |
          IP="$(curl -fsS https://checkip.amazonaws.com)"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp --port 22 --cidr "$IP/32"

      - name: 운영 환경변수 생성
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          KAKAO_ALLOWED_REDIRECT_URIS: ${{ secrets.KAKAO_ALLOWED_REDIRECT_URIS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_TOKEN_EXPIRATION: ${{ secrets.JWT_ACCESS_TOKEN_EXPIRATION }}
          JWT_REFRESH_TOKEN_EXPIRATION: ${{ secrets.JWT_REFRESH_TOKEN_EXPIRATION }}
          SWAGGER_USERNAME: ${{ secrets.SWAGGER_USERNAME }}
          SWAGGER_PASSWORD: ${{ secrets.SWAGGER_PASSWORD }}
          PAYOUT_ACCOUNT_ENCRYPTION_KEY: ${{ secrets.PAYOUT_ACCOUNT_ENCRYPTION_KEY }}
          AUTH_COOKIE_DOMAIN: ${{ secrets.AUTH_COOKIE_DOMAIN }}
        run: |
          umask 077
          {
            echo "SPRING_PROFILES_ACTIVE=prod"
            for name in DB_URL DB_USERNAME DB_PASSWORD KAKAO_CLIENT_ID KAKAO_CLIENT_SECRET KAKAO_REDIRECT_URI KAKAO_ALLOWED_REDIRECT_URIS JWT_SECRET JWT_ACCESS_TOKEN_EXPIRATION JWT_REFRESH_TOKEN_EXPIRATION SWAGGER_USERNAME SWAGGER_PASSWORD PAYOUT_ACCOUNT_ENCRYPTION_KEY AUTH_COOKIE_DOMAIN; do
              [ -n "${!name}" ] || { echo "::error::$name 미설정" >&2; exit 1; }
              printf '%s=%s\n' "$name" "${!name}"
            done
          } > .env

      - name: EC2 배포
        id: deploy
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          ssh -i ~/.ssh/id_deploy "$SSH_TARGET" 'mkdir -p ~/botem && chmod 700 ~/botem'
          scp -i ~/.ssh/id_deploy .env deploy/deploy.sh "$SSH_TARGET:botem/"
          ssh -i ~/.ssh/id_deploy "$SSH_TARGET" "bash botem/deploy.sh '$IMAGE'"

      # 배포가 길어져 처음 받은 임시 자격 증명이 만료돼도 SSH 허용 규칙을 해제할 수 있도록 다시 발급한다
      - name: 보안 그룹 정리용 AWS 자격 증명 재발급
        if: always() && steps.runner.outputs.ip != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 러너 IP의 SSH 허용 해제
        if: always() && steps.runner.outputs.ip != ''
        env:
          SECURITY_GROUP_ID: ${{ secrets.EC2_SECURITY_GROUP_ID }}
          IP: ${{ steps.runner.outputs.ip }}
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp --port 22 --cidr "$IP/32"

      # SSH 허용 해제가 디스패치에 막히지 않도록 정리 후 실행하고, 정리 실패와 무관하게 배포 성공 시 전송한다
      - name: 프론트엔드 Orval 코드 생성 트리거
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          repository: KUSITMS-BOTEM/BOTEM-FE
          event-type: backend-deployed
