name: CI

on:
  pull_request:
    branches: [develop, main]
  # setup-gradle은 기본 브랜치(develop) 실행에서만 캐시를 저장하므로, 머지 후에도 테스트를 돌려
  # 테스트 의존성까지 담긴 캐시를 남긴다. PR CI는 이 캐시를 읽어 Maven Central 다운로드(429)를 피한다
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

env:
  MIGRATION_PATHS: '^(src/main/resources/db/migration/|src/main/kotlin/.*/entity/|src/main/kotlin/.*/repository/|src/main/resources/application[^/]*\.ya?ml$|src/test/kotlin/com/botem/global/migration/|build\.gradle\.kts$|\.github/workflows/ci\.yml$)'

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      migration-changed: ${{ steps.migration-changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # 마이그레이션 관련 변경을 base 브랜치와 비교하기 위해 전체 이력을 가져온다
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: 테스트 및 커버리지 리포트 생성
        id: report
        run: ./gradlew test koverXmlReport koverHtmlReport

      # 기준 미달이어도 결과를 확인할 수 있도록 검증 전에 코멘트를 남긴다
      - name: PR 커버리지 코멘트
        if: ${{ github.event_name == 'pull_request' && !cancelled() && steps.report.outcome == 'success' }}
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: build/reports/kover/report.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: 📊 커버리지 리포트
          update-comment: true
          coverage-counter-type: LINE
          min-coverage-overall: 90

      - name: 커버리지 기준 검증
        run: ./gradlew koverVerify

      # 엔티티만 바꾸고 마이그레이션을 빠뜨린 경우도 잡도록 엔티티·설정 변경도 함께 감지한다
      - name: 마이그레이션 관련 변경 감지
        if: github.event_name == 'pull_request'
        id: migration-changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE "$MIGRATION_PATHS"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 마이그레이션·스키마 검증 (MySQL)
        if: steps.migration-changes.outputs.changed == 'true'
        run: |
          ./gradlew migrationTest
          # Docker가 없어 건너뛰었다면 검증하지 않은 것이므로 실패시킨다
          grep -q 'skipped="0"' build/test-results/migrationTest/TEST-com.botem.global.migration.MigrationSchemaTest.xml

      - name: 커버리지 리포트 업로드
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: kover-report
          path: build/reports/kover/html
          if-no-files-found: error

  # 엔티티·마이그레이션이 바뀐 PR이면 README의 ERD를 다시 만들어, 달라졌을 때만 PR 브랜치에 커밋한다.
  # GITHUB_TOKEN으로 올린 커밋은 워크플로를 다시 실행하지 않아 반복되지 않는다.
  # 다른 저장소(fork)에서 온 PR은 브랜치에 쓸 수 없으므로 실행하지 않는다
  erd:
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      needs.test.outputs.migration-changed == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: ERD 생성
        run: ./gradlew generateErd

      - name: 바뀐 ERD 커밋
        run: |
          if git diff --quiet -- README.md; then
            echo "ERD 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: ERD 자동 갱신"
          git push
