name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: 테스트 및 커버리지 리포트 생성
        id: report
        run: ./gradlew test koverXmlReport koverHtmlReport

      # 기준 미달이어도 결과를 확인할 수 있도록 검증 전에 코멘트를 남긴다
      - name: PR 커버리지 코멘트
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: build/reports/kover/report.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: 📊 커버리지 리포트
          update-comment: true
          coverage-counter-type: LINE
          min-coverage-overall: 90

      - name: 커버리지 기준 검증
        run: ./gradlew koverVerify

      - name: 커버리지 리포트 업로드
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: kover-report
          path: build/reports/kover/html
          if-no-files-found: error
