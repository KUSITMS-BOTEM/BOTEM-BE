upstream botem {
    # deploy.sh가 활성 포트(8081 또는 8082)로 교체
    include /etc/nginx/botem-upstream.inc;
}

server {
    listen 80;
    server_name _;

    location /actuator {
        return 404;
    }

    location / {
        proxy_pass http://botem;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
